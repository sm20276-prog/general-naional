<!DOCTYPE html>
<html lang="ar">
<head>

    <title>كتالوج الشركة</title>

<style>
    body {
        font-family: "Tahoma", Arial;
        direction: rtl;
        margin: 0;
        padding: 0;
        background: #f9f9f9;
        color: #222;
    }

    .header {
        background: #0056d2;
        padding: 20px;
        text-align: center;
        color: white;
        font-size: 22px;
        font-weight: bold;
    }

    .container {
        padding: 20px;
    }

    .product-box {
        background: white;
        padding: 20px;
        border-radius: 15px;
        margin-bottom: 30px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        text-align: center;
    }

    .product-box img {
        width: 100%;
        height: 220px;
        object-fit: cover;
        border-radius: 12px;
        border: 1px solid #ccc;
    }

    .btn-box {
        margin-top: 20px;
        display: flex;
        justify-content: center;
        gap: 10px;
        flex-wrap: wrap;
    }

    .btn {
        background: #007bff;
        color: white;
        padding: 12px 18px;
        border-radius: 10px;
        text-decoration: none;
        font-size: 18px;
        display: inline-block;
    }

    .btn:hover {
        background: #0056b3;
    }

    h2 {
        margin-top: 40px;
    }

    .footer {
        text-align: center;
        padding: 20px;
        margin-top: 40px;
        color: #555;
    }
