<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الخريطة</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background: #f5f5f5;
        }

        .map-btn {
            display: inline-block;
            background: #0088ff;
            color: #fff;
            padding: 14px 25px;
            border-radius: 10px;
            font-size: 20px;
            text-decoration: none;
            margin-bottom: 20px;
        }

        .map-container {
            width: 100%;
            max-width: 600px;
            margin: auto;
            height: 350px;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>

</head>
<body>

    <h2>موقعنا على الخريطة</h2>

    <!-- زر الخريطة -->
    <a class="map-btn" href="#map">اضغط لعرض الخريطة</a>

    <!-- الخريطة -->
    <div id="map" class="map-container">
        <iframe 
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d365.686312242072!2d47.93477413679071!3d29.311261614726547!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3fcf9be98ba1ac23%3A0xba91d22aa7aaf1bd!2z2LTYsdmD2Kkg2YXYrNmF2YjYudipINis2YbYsdin2YQg2KfZhNmI2LfZhtmK2Kkg2YTYqtis2KfYsdipINin2YTYrNmF2YTYqSDZiNin2YTYqtis2LLYptip!5e0!3m2!1sar!2skw!4v1764757835174!5m2!1sar!2skw"
            allowfullscreen="" 
            loading="lazy" 
            referrerpolicy="no-referrer-when-downgrade">
        </iframe>
    </div>

</body>
</html>
