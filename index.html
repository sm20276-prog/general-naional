
<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>كتالوج المتجر</title>

  <style>
    body {
      font-family: "Tahoma", Arial;
      direction: rtl;
      margin: 0;
      padding: 0;
      color: #222;
      background: #f9f9f9;
    }

    header {
      background: #f8f8f8;
      padding: 18px;
      text-align: center;
      border-bottom: 1px solid #eee;
    }

    .container {
      max-width: 1000px;
      margin: 20px auto;
      padding: 0 12px;
      background: #fff;
      border-radius: 10px;
    }

    .grid {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }

    .card {
      flex: 1 1 220px;
      border: 1px solid #e6e6e6;
      padding: 12px;
      border-radius: 8px;
      background: #fff;
      transition: 0.3s;
    }

    .card:hover {
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 6px;
    }

    .btn {
      display: inline-block;
      margin-top: 8px;
      padding: 10px 14px;
      border-radius: 6px;
      text-decoration: none;
      background: #1573ff;
      color: #fff;
      font-weight: bold;
      transition: 0.3s;
      border: none;
    }

    .btn:hover {
      background: #0d52b3;
      color: #fff;
    }

    footer {
      padding: 14px;
      text-align: center;
      background: #fafafa;
      border-top: 1px solid #eee;
      margin-top: 24px;
    }

    @media(max-width:600px){
      .grid{flex-direction:column}
    }
  </style>

</head>
<body>

<header>
  <h1>GENERAL NATIONAL</h1>
  <p>موقع، رقم المبيعات، رقم الصيانة وكل صور الكتالوج في مكان واحد</p>
</header>

<div class="container">

  <section>
    <h2>المنتجات</h2>
    <div class="grid">

      <div class="card">
        <img src="catalog1.jpg" alt="منتج 1">
        <h3>GENERAL NATIONAL 1</h3>

        <a class="btn" href="tel:+96541000088">اتصل للمبيعات</a>
        <a class="btn" href="https://wa.me/96541000088" target="_blank">واتساب</a>
        <a class="btn" href="catalog.pdf" target="_blank">عرض ملف الـ PDF</a>
      </div>

    </div>
  </section>

  <section style="margin-top:20px;">
    <h2>الصيانة والموقع</h2>
    <p>رقم المبيعات: <a href="tel:+96541000088">+965 41000088</a></p>
    <p>رقم الصيانة: <a href="tel:+96541011155">+965 41011155</a></p>
  </section>

  <section style="margin-top:20px;">
    <h2>الموقع على الخريطة</h2>

    <a class="btn" 
       href="https://maps.app.goo.gl/tohJze4qrsgZUzz56?g_st=ipc" 
       target="_blank">
      عرض الموقع على الخريطة
    </a>

  </section>

</div>

<footer>
  جميع الحقوق محفوظة © 2025
</footer>

</body>
</html>
